name: meddeck
description: Clinical slide library app
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '^3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^14.2.0

  # Firebase core
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.0

  # Auth providers
  google_sign_in: ^6.2.1

  # File picking (PPT upload)
  file_picker: ^8.0.0

  # Images & utilities
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  path: ^1.9.0

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
